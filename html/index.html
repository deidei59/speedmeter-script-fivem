
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APOC Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="speedometer" class="hidden">
        <div class="speed-panel">

            <div class="speed-main">
                <div class="speed-value" id="speed">0</div>
                <div class="speed-unit">
                    <span class="unit-dot"></span>
                    KM/H
                </div>
            </div>

            <div class="speed-divider"></div>

            <div class="vehicle-info">
                <div class="info-label">BOÎTE</div>
                <div class="gear-value" id="gear">N</div>
            </div>

            <div class="vehicle-info engine-info">
                <div class="info-label">MOTEUR</div>
                <div class="engine-state">
                    <span class="engine-dot" id="engine-dot"></span>
                    <span id="engine-text">OFF</span>
                </div>
            </div>

            <div class="vehicle-info passengers-info">
                <div class="info-label">PERSONNES</div>
                <div class="passengers-state">
                    <svg class="passengers-icon"
                         viewBox="0 0 24 24"
                         aria-hidden="true">
                        <circle cx="9" cy="7" r="3"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"/>
                        <path d="M3 19v-2a6 6 0 0 1 12 0v2"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>
                        <path d="M16 4a3 3 0 0 1 0 6
                                 M18 13a5 5 0 0 1 3 4v2"
                              fill="none"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>
                    </svg>
                    <span id="passengers">1/4</span>
                </div>
            </div>

        </div>

        <div class="speed-track">
            <div class="speed-progress" id="speed-progress"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
